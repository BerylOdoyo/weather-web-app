<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Web App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="transparent-background">
      <div class="weather-card">
        <div class="search-container">
          <div>
            <input type="text" placeholder="search" class="search-bar" />
          </div>
          <div>
            <button class="search-button">
              <img
                src="images/search.png"
                alt="search-icon"
                class="search-icon"
              />
            </button>
          </div>
        </div>
        <div class="weather-information-container">
          <div>
            <img
              src="images/clouds.png"
              alt="weather-icon"
              class="weather-icon"
            />
          </div>
          <div>
            <p class="temperature">29℃</p>
          </div>
          <div>
            <p class="city-name">NAIROBI</p>
          </div>
        </div>
        <div class="humidity-uv-container">
          <div class="humidity-information">
            <div>
              <img
                src="images/humidity.svg"
                alt="humidity-icon"
                class="humidity-icon"
              />
            </div>
            <div class="weather-percentage-name">
              <div class="weather-percentage-container">
                <p class="weather-percentage">50%</p>
              </div>
              <div class="weather-name-container">
                <p class="weather-name">Humidity</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
